<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>字幕本地化质检</title>
<style>body{font:15px/1.5 system-ui,sans-serif;max-width:1080px;margin:32px auto;padding:0 18px}input,select,textarea,button{padding:7px;margin:3px}.card{border:1px solid #d9e1e8;border-radius:10px;padding:16px;margin:16px 0}pre,textarea{background:#f5f7f9;padding:12px;overflow:auto;width:100%;box-sizing:border-box}button{cursor:pointer}small{color:#667}</style></head>
<body><h1>影视字幕本地化质检</h1><p>示例项目已含术语表和三句原文字幕。流程：维护原文字幕 → 录入译文字幕 → 提交映射批次（一张译文覆盖连续一段原文，不交叉不留空）→ 提交复核 → 复核 → 锁定 → 交付。原文变更会让受影响译文和复核结果失效。</p>
<div class="card"><h2>身份与版本</h2><input id="user" value="alice"><select id="role"><option>owner</option><option>reviewer</option><option>translator</option><option>admin</option></select><label>项目 ID <input id="project" type="number" value="1"></label><label>版本 ID <input id="version" type="number" value="1"></label><button onclick="refresh()">刷新</button><pre id="data">等待刷新…</pre></div>
<div class="card"><h2>原文字幕</h2><textarea id="sourceCue" rows="4">{"cue_index":4,"start_ms":8500,"end_ms":10000,"text":"The ice begins to crack.","expected_revision":3}</textarea><button onclick="saveSourceCue()">保存原文字幕</button><pre id="sourceResult"></pre></div>
<div class="card"><h2>录入译文字幕</h2><textarea id="cue" rows="5">{"cue_index":1,"start_ms":1000,"end_ms":3000,"text":"海豹出现在冰面上","expected_revision":0}</textarea><button onclick="saveCue()">保存字幕</button><pre id="cueResult"></pre></div>
<div class="card"><h2>映射批次</h2><small>base_batch_no 填当前最新批次号（没有则填 0）；冲突时返回最新批次，你的输入保留在上方文本框。</small><textarea id="mapping" rows="5">{"base_batch_no":0,"mappings":[{"cue_id":1,"source_start_index":1,"source_end_index":3}]}</textarea><button onclick="saveMapping()">提交映射批次</button><pre id="mappingResult"></pre></div>
<div class="card"><h2>时间点评论</h2><input id="time" type="number" value="1200"><input id="comment" value="请复核这里的术语"><button onclick="addComment()">添加评论</button><pre id="commentResult"></pre></div>
<div class="card"><h2>状态流转</h2><button onclick="action('submit')">提交复核</button><button onclick="review('approve')">复核通过</button><button onclick="review('reject')">退回修改</button><button onclick="action('lock')">锁定</button><button onclick="action('deliver')">交付</button><pre id="stateResult"></pre></div>
<script>
const auth=()=>({'Content-Type':'application/json','X-User':user.value,'X-Role':role.value});
async function call(url,opts={}){const r=await fetch(url,opts);const j=await r.json();if(!r.ok){const e=Error(j.error||r.status);e.payload=j;throw e}return j}
function show(el,e){el.textContent=e.message+(e.payload&&e.payload.current_batch?'\n最新批次:\n'+JSON.stringify(e.payload.current_batch,null,2):'')}
async function saveSourceCue(){try{sourceResult.textContent=JSON.stringify(await call('/api/projects/'+project.value+'/source-cues',{method:'POST',headers:auth(),body:sourceCue.value}),null,2)}catch(e){show(sourceResult,e)}}
async function saveCue(){try{cueResult.textContent=JSON.stringify(await call('/api/versions/'+version.value+'/cues',{method:'POST',headers:auth(),body:cue.value}),null,2)}catch(e){show(cueResult,e)}}
async function saveMapping(){try{mappingResult.textContent=JSON.stringify(await call('/api/versions/'+version.value+'/mappings',{method:'POST',headers:auth(),body:mapping.value}),null,2)}catch(e){show(mappingResult,e)}}
async function addComment(){try{commentResult.textContent=JSON.stringify(await call('/api/versions/'+version.value+'/comments',{method:'POST',headers:auth(),body:JSON.stringify({time_ms:+time.value,body:comment.value})}),null,2)}catch(e){commentResult.textContent=e.message}}
async function action(name){try{stateResult.textContent=JSON.stringify(await call('/api/versions/'+version.value+'/'+name,{method:'POST',headers:auth(),body:'{}'}),null,2);refresh()}catch(e){stateResult.textContent=e.message}}
async function review(decision){try{stateResult.textContent=JSON.stringify(await call('/api/versions/'+version.value+'/review',{method:'POST',headers:auth(),body:JSON.stringify({decision,comment:''})}),null,2);refresh()}catch(e){stateResult.textContent=e.message}}
async function refresh(){try{const [p,v,sc,c,m,d,cm,q,dl]=await Promise.all(['/api/projects','/api/versions','/api/projects/'+project.value+'/source-cues','/api/versions/'+version.value+'/cues','/api/versions/'+version.value+'/mappings','/api/versions/'+version.value+'/detail','/api/versions/'+version.value+'/comments','/api/review-queue','/api/deliveries'].map(call));data.textContent=JSON.stringify({p,v,sc,c,m,d,cm,q,dl},null,2)}catch(e){data.textContent=e.message}}
</script></body></html>
