<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>字幕本地化质检</title>
<style>body{font:15px/1.5 system-ui,sans-serif;max-width:1080px;margin:32px auto;padding:0 18px}input,select,textarea,button{padding:7px;margin:3px}.card{border:1px solid #d9e1e8;border-radius:10px;padding:16px;margin:16px 0}pre,textarea{background:#f5f7f9;padding:12px;overflow:auto;width:100%;box-sizing:border-box}button{cursor:pointer}small{color:#667}.stale{color:#b00}.pending{color:#a60}.confirmed{color:#070}</style></head>
<body><h1>影视字幕本地化质检</h1><p>原文字幕、译文字幕、映射批次和交付快照共用一份对应关系。一张译文字幕覆盖连续的一段原文，不交叉、不留空；原文修订只令受影响映射失效。</p>
<div class="card"><h2>身份与版本</h2><input id="user" value="alice"><select id="role"><option>owner</option><option>reviewer</option><option>translator</option><option>admin</option></select><label>项目 ID <input id="project" type="number" value="1"></label><label>版本 ID <input id="version" type="number" value="1"></label><button onclick="refresh()">刷新</button><pre id="data">等待刷新…</pre></div>
<div class="card"><h2>原文字幕（负责人维护）</h2><textarea id="source" rows="4">{"cue_index":1,"start_ms":1000,"end_ms":3000,"text":"A seal rests on the ice."}</textarea><button onclick="saveSource()">保存原文字幕</button><pre id="sourceResult"></pre></div>
<div class="card"><h2>译文字幕</h2><textarea id="cue" rows="5">{"cue_index":1,"start_ms":1000,"end_ms":3000,"text":"一只海豹在冰面休息。","expected_revision":0}</textarea><button onclick="saveCue()">保存译文字幕</button><pre id="cueResult"></pre></div>
<div class="card"><h2>映射批次（一份完整对应）</h2><textarea id="mapping" rows="7">{"expected_mapping_revision":0,"idempotency_key":"batch-1","mappings":[{"cue_id":1,"source_start_index":1,"source_end_index":1},{"cue_id":2,"source_start_index":2,"source_end_index":2}]}</textarea><br><button onclick="submitMappings()">提交映射批次</button><button onclick="recoverMappings()">写入失败后恢复</button><pre id="mappingResult"></pre></div>
<div class="card"><h2>时间点评论</h2><input id="time" type="number" value="1200"><input id="comment" value="请复核这里的术语"><button onclick="addComment()">添加评论</button><pre id="commentResult"></pre></div>
<div class="card"><h2>状态流转</h2><button onclick="action('submit')">提交复核</button><button onclick="review('approve')">复核通过</button><button onclick="review('reject')">退回修改</button><button onclick="action('lock')">锁定</button><button onclick="action('deliver')">交付</button><pre id="stateResult"></pre></div>
<script>
const auth=()=>({'Content-Type':'application/json','X-User':user.value,'X-Role':role.value});
async function call(url,opts={}){const r=await fetch(url,opts);const j=await r.json();if(!r.ok){const e=Error(j.error||r.status);e.payload=j;throw e}return j}
async function saveCue(){try{cueResult.textContent=JSON.stringify(await call('/api/versions/'+version.value+'/cues',{method:'POST',headers:auth(),body:cue.value}),null,2)}catch(e){cueResult.textContent=e.message}}
async function saveSource(){try{sourceResult.textContent=JSON.stringify(await call('/api/projects/'+project.value+'/source-cues',{method:'POST',headers:auth(),body:source.value}),null,2);refresh()}catch(e){sourceResult.textContent=e.message}}
async function submitMappings(){try{mappingResult.textContent=JSON.stringify(await call('/api/versions/'+version.value+'/mappings',{method:'POST',headers:auth(),body:mapping.value}),null,2);refresh()}catch(e){mappingResult.textContent=e.message+(e.payload?'\n\n'+JSON.stringify(e.payload,null,2):'')}}
async function recoverMappings(){try{mappingResult.textContent=JSON.stringify(await call('/api/versions/'+version.value+'/recover-mappings',{method:'POST',headers:auth(),body:'{}'}),null,2);refresh()}catch(e){mappingResult.textContent=e.message}}
async function addComment(){try{commentResult.textContent=JSON.stringify(await call('/api/versions/'+version.value+'/comments',{method:'POST',headers:auth(),body:JSON.stringify({time_ms:+time.value,body:comment.value})}),null,2)}catch(e){commentResult.textContent=e.message}}
async function action(name){try{stateResult.textContent=JSON.stringify(await call('/api/versions/'+version.value+'/'+name,{method:'POST',headers:auth(),body:'{}'}),null,2);refresh()}catch(e){stateResult.textContent=e.message+(e.payload?'\n\n'+JSON.stringify(e.payload.alignment||e.payload,null,2):'')}}
async function review(decision){try{stateResult.textContent=JSON.stringify(await call('/api/versions/'+version.value+'/review',{method:'POST',headers:auth(),body:JSON.stringify({decision,comment:''})}),null,2);refresh()}catch(e){stateResult.textContent=e.message}}
async function refresh(){try{const [p,s,v,c,cm,m,q,d]=await Promise.all(['/api/projects','/api/projects/'+project.value+'/source-cues','/api/versions','/api/versions/'+version.value+'/cues','/api/versions/'+version.value+'/comments','/api/versions/'+version.value+'/mappings','/api/versions/'+version.value+'/review-queue','/api/deliveries'].map(u=>call(u)));data.textContent=JSON.stringify({p,s,v,c,cm,m,q,d},null,2)}catch(e){data.textContent=e.message}}
</script></body></html>
